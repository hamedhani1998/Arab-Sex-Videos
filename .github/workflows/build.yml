name: Build and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build all modules
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew build

      - name: Collect cs3 artifacts
        run: |
          mkdir -p dist
          for f in */build/*.cs3; do
            [ -f "$f" ] && cp "$f" dist/
          done
          ls -la dist/

      - name: Generate plugins.json
        run: |
          python3 - <<'EOF'
          import json, os, hashlib, glob
          plugins = []
          repo_url = "https://github.com/${{ github.repository }}"
          # name of .cs3 file = module name = unique internalName
          label_map = {
            "SexAlarab": "سكس العرب",
            "SexAlarabNet": "سكس العرب نت",
            "ArabXCam": "عرب اكس",
            "XHorno": "xhorno",
            "ArabXN": "عرب xn",
            "ArabXNSex": "arabxn.sex",
          }
          for f in sorted(glob.glob("dist/*.cs3")):
              name = os.path.basename(f)[:-4]
              label = label_map.get(name, name)
              with open(f, "rb") as fh:
                  data = fh.read()
              plugins.append({
                  "apiVersion": 1,
                  "repositoryUrl": repo_url,
                  "fileSize": len(data),
                  "status": 1,
                  "language": "ar",
                  "authors": ["hamedhani1998"],
                  "tvTypes": ["NSFW"],
                  "version": 1,
                  "internalName": name,
                  "description": f"{label} - أفلام إباحية عربية",
                  "url": f"{repo_url}/raw/refs/heads/builds/{name}.cs3",
                  "name": label,
                  "fileHash": "sha256-" + hashlib.sha256(data).hexdigest(),
              })
          with open("dist/plugins.json", "w", encoding="utf-8") as fh:
              json.dump(plugins, fh, ensure_ascii=False, indent=2)
          print("dist files:", os.listdir("dist"))
          EOF

      - name: Publish to builds branch
        run: |
          rm -rf _publish
          mkdir -p _publish
          cp dist/*.cs3 dist/plugins.json _publish/
          ls -la _publish
          cd _publish
          git init -q
          git config user.name "hamedhani1998"
          git config user.email "hamedhani1998@users.noreply.github.com"
          git add -A
          git commit -m "Publish plugins"
          git branch -M builds
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin builds